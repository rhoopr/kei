# Typos configuration
# https://github.com/crate-ci/typos

[default.extend-words]
# HSA = Apple's authentication system term (Hardware Security Authentication)
hsa = "hsa"
# Used in s2k_fo protocol (Apple SRP) and base32 test data
fo = "fo"
# Appears in base64-encoded test data (e.g. "QUJDMTIz")
Iz = "Iz"
# Test data: "Café" stripped to "Caf" by remove_unicode_chars()
Caf = "Caf"
# Appears in randomized asset ID test data (e.g. "APn3rWx5Z")
Pn = "Pn"
# THM = camera thumbnail file extension (e.g. Canon .THM files)
THM = "THM"
# `Nd` is the placeholder in `--recent Nd` (days form); a CLI-shape
# template, not a typo for "And".
Nd = "Nd"

[default]
# The `mis-` prefix (mis-routing, mis-attributed, mis-directed) is grammatical
# English; typos wants to "fix" it to `miss`/`mist`. Suppress those matches.
extend-ignore-re = ["\\bmis-\\w+"]

[type.cc-by-2]
extend-glob = ["LICENSE-osxphotos-media"]

[type.cc-by-2.extend-words]
# Preserve the spelling in the verbatim upstream CC BY 2.0 legal text.
MERCHANTIBILITY = "MERCHANTIBILITY"
