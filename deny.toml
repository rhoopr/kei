# Dependency policy for cargo-deny. Enforced by the shared checks, nightly,
# release validation, and `just static-checks`.

[graph]
# Cover optional dependencies too, matching the Cargo.lock-wide coverage of the
# previous cargo-audit gate.
all-features = true

[advisories]
# Match the removed `cargo audit --deny warnings` gate: all unmaintained and
# unsound advisories deny, including those in transitive dependencies, and
# yanked crate versions deny. Vulnerabilities always deny.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # chrono has an unmaintained-only advisory with no patched release.
    # Remove this exception when the timestamp-compatible migration in
    # https://github.com/rhoopr/kei/issues/1066 removes chrono from the tree.
    "RUSTSEC-2026-0543",

    # `paste 1.0.15` is pulled in by little_exif, which backs JPEG/TIFF
    # EXIF writes when kei is built without the default `xmp` feature.
    # The advisory is unmaintained-only, not a known vulnerability.
    # Remove this ignore once little_exif drops paste or replaces it with
    # a maintained macro helper.
    # Advisory: https://rustsec.org/advisories/RUSTSEC-2024-0436
    "RUSTSEC-2024-0436",

    # `quick-xml` reaches kei through plist and little_exif. plist has not
    # released a version on quick-xml >= 0.41 yet, and little_exif still pins
    # an older quick-xml line. The vulnerable XML parser paths are not used for
    # untrusted XML ingestion in the changed auth flow.
    # Remove these ignores once plist and little_exif can both resolve
    # quick-xml >= 0.41.
    # Advisories: https://rustsec.org/advisories/RUSTSEC-2026-0194
    #             https://rustsec.org/advisories/RUSTSEC-2026-0195
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # option-ext is the only MPL-2.0 crate in the graph. MPL-2.0 is a
    # file-level copyleft license that permits distribution in binary form.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # webpki-root-certs ships CA certificate data under CDLA-Permissive-2.0,
    # a permissive data license, through rustls-platform-verifier.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
