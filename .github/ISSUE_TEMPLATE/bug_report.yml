name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "user-reported"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below so we can reproduce and fix the issue.

  - type: textarea
    id: support-export
    attributes:
      label: Support diagnostic export
      description: |
        Please attach the locally reviewed JSON file up front, if available:
        `kei --config ~/.config/kei/config.toml support-export --output kei-support.json`
        Use your normal config and KEI_DATA_DIR. In Docker: `docker exec kei kei --config /config/config.toml support-export --output /config/kei-support.json`, then copy it from your config mount.
        This runs offline without a new sync, login, repair or migration and uploads nothing. It excludes credentials, personal paths, album/asset IDs, checksums and free-text errors. Partial files are useful too.
        If your version lacks the command or collection fails, submit anyway and say so here. Do not attach raw databases, auth files, config or reports.
      placeholder: Attach kei-support.json here, or explain why it is unavailable.
    validations:
      required: false

  - type: checkboxes
    id: adp-check
    attributes:
      label: Advanced Data Protection
      description: kei's iCloud web session needs iCloud.com Photos access. Bugs that only reproduce with web access disabled are not actionable here.
      options:
        - label: I have confirmed that ADP is disabled and "Access iCloud Data on the Web" is enabled
          required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What actually happened?
      placeholder: Describe what you saw, including any error messages or unexpected output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps and commands to reproduce the issue. Include only reviewed, redacted config snippets if necessary.
      placeholder: |
        ```toml
        # config.toml (if applicable)
        ```

        ```sh
        kei sync --config ~/.config/kei/config.toml ...
        ```
      render: markdown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of `kei --version`, or the Docker image tag."
      placeholder: "kei 0.22.9"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Docker
        - Homebrew
        - GitHub release binary
        - Built from source
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Logs, screenshots, config snippets, or links. Redact Apple IDs, passwords, session cookies, bearer tokens, webhook URLs, and local paths you do not want public.
    validations:
      required: false
