name: OpenCode advisory review

# Both workflow and executable scripts come from the trusted default-branch commit.
# PR files are API data only. Never change this checkout to the PR head/merge ref.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing PR number to review once
        required: false
        type: string

concurrency:
  # Comments get separate groups so unrelated or unauthorized comments cannot cancel reviews.
  group: opencode-go-review-${{ github.event_name == 'issues' && 'issue' || 'pr' }}-${{ github.event.comment.id || inputs.pr_number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'issues' }}

permissions: {}

jobs:
  review:
    if: >-
      (github.event_name == 'issue_comment' && github.event.action == 'created' &&
       github.event.issue.pull_request && github.event.comment.user.type == 'User' &&
       contains(github.event.comment.body, '/opencode review')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Collect complete PR diff and head context
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/opencode_review.py prepare
      - name: Review data with DeepSeek Go then GLM Go
        if: steps.prepare.outputs.prepared == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_GO_MODEL: ${{ vars.OPENCODE_GO_MODEL }}
          # Set true only after confirming Console Use balance is disabled.
          OPENCODE_GO_NO_OVERAGE_CONFIRMED: ${{ vars.OPENCODE_GO_NO_OVERAGE_CONFIRMED }}
        run: python3 -I scripts/ci/opencode_review.py infer
      - name: Save validated findings only
        if: steps.prepare.outputs.prepared == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencode-go-findings
          path: review-result.json
          if-no-files-found: error
          retention-days: 1
    outputs:
      prepared: ${{ steps.prepare.outputs.prepared }}
      head: ${{ steps.prepare.outputs.head }}

  publish:
    needs: review
    if: needs.review.outputs.prepared == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Serialize the final duplicate check and POST across comments and dispatches.
    concurrency:
      group: opencode-go-publish-pr-${{ inputs.pr_number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opencode-go-findings
          path: result
      - name: Validate and publish advisory review
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ needs.review.outputs.head }}
        run: python3 -I scripts/ci/opencode_review.py publish

  # Pin identities once so both reviewers inspect the same issue and main.
  issue-pin:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
    outputs:
      prepared: ${{ steps.pin.outputs.prepared }}
      head: ${{ steps.pin.outputs.head }}
      snapshot: ${{ steps.pin.outputs.snapshot }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/opencode_review.py issue-pin

  issue-review:
    needs: issue-pin
    if: needs.issue-pin.outputs.prepared == 'true'
    strategy:
      fail-fast: false
      matrix:
        kind: [product, code]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    env:
      ISSUE_REVIEW_KIND: ${{ matrix.kind }}
      EXPECTED_MAIN_SHA: ${{ needs.issue-pin.outputs.head }}
      EXPECTED_ISSUE_SNAPSHOT: ${{ needs.issue-pin.outputs.snapshot }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Collect bounded pinned issue evidence
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/opencode_review.py issue-prepare
      - name: Review issue evidence with DeepSeek Go then GLM Go
        if: steps.prepare.outputs.prepared == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_GO_MODEL: ${{ vars.OPENCODE_GO_MODEL }}
          OPENCODE_GO_NO_OVERAGE_CONFIRMED: ${{ vars.OPENCODE_GO_NO_OVERAGE_CONFIRMED }}
        run: python3 -I scripts/ci/opencode_review.py issue-infer
      - name: Save only validated advisory result
        if: steps.prepare.outputs.prepared == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencode-issue-${{ matrix.kind }}
          path: issue-review-result.json
          if-no-files-found: error
          retention-days: 1

  issue-publish:
    needs: [issue-pin, issue-review]
    # A failed sibling reviewer must not suppress a validated result.
    if: >-
      always() && !cancelled() && needs.issue-pin.outputs.prepared == 'true'
    strategy:
      fail-fast: false
      matrix:
        kind: [product, code]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: download
        # Missing artifact means this reviewer failed or was already published.
        continue-on-error: true
        with:
          name: opencode-issue-${{ matrix.kind }}
          path: result
      - name: Validate and publish one advisory issue comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_REVIEW_KIND: ${{ matrix.kind }}
          EXPECTED_MAIN_SHA: ${{ needs.issue-pin.outputs.head }}
          EXPECTED_ISSUE_SNAPSHOT: ${{ needs.issue-pin.outputs.snapshot }}
        run: python3 -I scripts/ci/opencode_review.py issue-publish
