name: OpenCode CLI Free smoke

# Manual only. Keep production review routing and publication unchanged.
on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        model: [deepseek-v4.1-flash-free, glm-5.3-flash-free]
    steps:
      - name: Download verified official CLI release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opencode-cli-bin"
          archive="$RUNNER_TEMP/opencode-cli.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 120 --max-filesize 70000000 \
            --output "$archive" \
            https://github.com/anomalyco/opencode/releases/download/v1.19.3/opencode-linux-x64.tar.gz
          echo "13a8fb2978302071b86f9d7e00da9c8895f9cd846978379c3bdc6a5333536c9b  $archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/opencode-cli-bin" opencode
      - name: Run one isolated Free-model CLI invocation
        env:
          SMOKE_MODEL: ${{ matrix.model }}
          OPENCODE_BINARY: ${{ runner.temp }}/opencode-cli-bin/opencode
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import selectors
          import signal
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          MODELS = {"deepseek-v4.1-flash-free", "glm-5.3-flash-free"}
          LIMIT = 512 * 1024
          TIMEOUT = 120


          def settings(model):
              return {
                  "model": "opencode/" + model, "small_model": "opencode/" + model,
                  "enabled_providers": ["opencode"],
                  "provider": {"opencode": {"whitelist": [model]}},
                  "share": "disabled", "autoupdate": False, "snapshot": False,
                  "plugin": [], "mcp": {}, "instructions": [], "permission": {"*": "deny"},
                  "compaction": {"auto": False, "prune": False},
                  "experimental": {"openTelemetry": False},
                  "agent": {"smoke": {"mode": "primary", "steps": 1,
                                      "permission": {"*": "deny"},
                                      "prompt": "Reply with exactly TEST_OK. Do not use tools."}},
              }


          def summarize(raw, model, exit_code, stopped=None):
              result = {"model": model, "cli_exit": exit_code, "outcome": stopped or "not_confirmed",
                        "http_status": None, "final_text": None}
              text, finishes, tools, errors = [], [], False, []
              try:
                  for line in raw.decode("utf-8").splitlines():
                      event = json.loads(line)
                      part = event.get("part", {})
                      if event.get("type") == "text":
                          text.append(part.get("text", ""))
                      elif event.get("type") == "step_finish":
                          finishes.append(part.get("reason"))
                      elif event.get("type") == "tool_use":
                          tools = True
                      elif event.get("type") == "error":
                          errors.append(event.get("error", {}))
                  for error in errors:
                      data = error.get("data", {})
                      status = data.get("statusCode")
                      if type(status) is int and 100 <= status <= 599:
                          result["http_status"] = status
                      # Never emit raw error messages, headers, reasoning, or session data.
                      detail = str(data.get("responseBody", "")) + str(data.get("message", ""))
                      result["error_category"] = (
                          "free_tier_restricted" if "FreeTierError" in detail else
                          "free_usage_limit" if "FreeUsageLimitError" in detail else "cli_provider_error")
                  if (not stopped and exit_code == 0 and not errors and not tools
                          and finishes == ["stop"] and "".join(text).strip() == "TEST_OK"):
                      result.update(outcome="usable_completion", final_text="TEST_OK")
                  result["finish_reason"] = "stop" if finishes == ["stop"] else "unconfirmed"
                  result["tool_use"] = tools
              except (ValueError, TypeError, AttributeError, UnicodeError):
                  result["outcome"] = "invalid_cli_events"
              return result


          def smoke(binary, model):
              if model not in MODELS:
                  raise ValueError("Model is outside the two Free choices.")
              with tempfile.TemporaryDirectory(prefix="kei-opencode-cli-") as name:
                  base = Path(name)
                  work = base / "work"
                  work.mkdir()
                  env = {"PATH": "/usr/bin:/bin", "LANG": "C.UTF-8", "CI": "true"}
                  for key, suffix in (("HOME", "home"), ("XDG_CONFIG_HOME", "config"),
                                      ("XDG_DATA_HOME", "data"), ("XDG_CACHE_HOME", "cache"),
                                      ("XDG_STATE_HOME", "state"), ("TMPDIR", "tmp")):
                      directory = base / suffix
                      directory.mkdir()
                      env[key] = str(directory)
                  env.update({
                      "OPENCODE_CONFIG_CONTENT": json.dumps(settings(model)),
                      "OPENCODE_PURE": "1", "OPENCODE_DISABLE_DEFAULT_PLUGINS": "1",
                      "OPENCODE_DISABLE_PROJECT_CONFIG": "1", "OPENCODE_DISABLE_AUTOUPDATE": "1",
                      "OPENCODE_DISABLE_MODELS_FETCH": "1", "OPENCODE_DISABLE_AUTOCOMPACT": "1",
                      "OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX": "8192", "OTEL_SDK_DISABLED": "true",
                  })
                  # No repository checkout, inherited credentials, GitHub token, or custom client identity.
                  command = [binary, "run", "--format", "json", "--model", "opencode/" + model,
                             "--agent", "smoke", "--title", "Free CLI smoke", "--log-level", "ERROR", "test"]
                  with subprocess.Popen(command, cwd=work, env=env, stdin=subprocess.DEVNULL,
                                        stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                                        start_new_session=True) as process:
                      data, stopped = bytearray(), None
                      deadline = time.monotonic() + TIMEOUT
                      with selectors.DefaultSelector() as selector:
                          selector.register(process.stdout, selectors.EVENT_READ)
                          while selector.get_map():
                              if time.monotonic() >= deadline:
                                  stopped = "timeout"
                                  break
                              if not selector.select(timeout=1):
                                  continue
                              chunk = os.read(process.stdout.fileno(), 65536)
                              if not chunk:
                                  break
                              if len(data) + len(chunk) > LIMIT:
                                  stopped = "output_limit"
                                  break
                              data.extend(chunk)
                      if stopped:
                          os.killpg(process.pid, signal.SIGKILL)
                      try:
                          exit_code = process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          exit_code, stopped = process.wait(), "timeout"
                  return summarize(data, model, exit_code, stopped)


          if __name__ == "__main__":
              result = smoke(os.environ["OPENCODE_BINARY"], os.environ["SMOKE_MODEL"])
              print(json.dumps(result, sort_keys=True))
              raise SystemExit(0 if result["outcome"] == "usable_completion" else 1)
          PY
