name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE_TOOLCHAIN: "1.94.1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fast sanity checks before the expensive 5-target build matrix.
  # Catches version mismatches, missing CHANGELOG, and new advisories
  # before burning 15+ minutes of build time.
  validate:
    permissions:
      contents: read
      statuses: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - uses: taiki-e/install-action@b7d831ec1a6ef0d81d27cf61932d92140b2271d4 # cargo-audit

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Verify CHANGELOG has entry for this version
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION"
            exit 1
          fi

      - name: Security audit
        run: cargo audit --deny warnings

      - name: Require exact-commit local prerequisites before a release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/local_release.py check --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"

  qualification:
    needs: validate
    uses: ./.github/workflows/qualification.yml

  release:
    needs: qualification
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          path: candidate
          merge-multiple: true

      - name: Reverify candidates before publication
        run: python3 scripts/ci/artifact.py verify
      - name: Generate checksums
        run: |
          cd candidate
          sha256sum -- *.tar.gz *.zip > SHA256SUMS.txt

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Extract the current version's section from CHANGELOG.md
          # Captures everything between ## [VERSION] and the next ## [ or ---
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[|^---/{if(found) exit} found" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md section for $VERSION is empty"
            exit 1
          else
            {
              echo "notes<<EOF"
              echo "$NOTES"
              echo ""
              echo "---"
              echo "**Full changelog:** [CHANGELOG.md](https://github.com/rhoopr/kei/blob/${{ github.ref_name }}/CHANGELOG.md)"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            candidate/*.tar.gz
            candidate/*.zip
            candidate/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    needs: [qualification, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          path: candidate
          merge-multiple: true
      - name: Reverify the qualified bytes
        run: python3 scripts/ci/artifact.py verify
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image IDs without rebuilding
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            docker load --input "candidate/container-$arch.tar"
            id=$(jq -er .image_id "candidate/container-$arch.json")
            test "$(docker image inspect kei:candidate --format '{{.Id}}')" = "$id"
            docker tag "$id" "$image:$version-$arch"
            docker push "$image:$version-$arch"
          done
          docker buildx imagetools create -t "$image:$version" "$image:$version-amd64" "$image:$version-arm64"
          # Do not move stable aliases for a prerelease.
          if [[ "$version" != *-* ]]; then
            docker buildx imagetools create -t "$image:${version%.*}" -t "$image:latest" "$image:$version"
          fi

  homebrew:
    needs: [release, containers]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rhoopr/homebrew-kei
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/rhoopr/kei/releases/download/${{ github.ref_name }}"

          declare -A ASSETS=(
            [macos-aarch64]="kei-macos-aarch64.tar.gz"
            [macos-x86_64]="kei-macos-x86_64.tar.gz"
            [linux-aarch64]="kei-linux-aarch64.tar.gz"
            [linux-x86_64]="kei-linux-x86_64.tar.gz"
          )

          declare -A SHAS
          curl -fsSL "$BASE/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
          for key in "${!ASSETS[@]}"; do
            file="${ASSETS[$key]}"
            curl -fsSL "$BASE/$file" -o "/tmp/$file"
            expected_sha=$(awk -v file="$file" '$2 == file { print $1 }' /tmp/SHA256SUMS.txt)
            if [ -z "$expected_sha" ]; then
              echo "::error::SHA256SUMS.txt does not list $file"
              exit 1
            fi
            actual_sha=$(sha256sum "/tmp/$file" | cut -d' ' -f1)
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::$file checksum mismatch"
              echo "expected: $expected_sha"
              echo "actual:   $actual_sha"
              exit 1
            fi
            SHAS[$key]="$actual_sha"
          done

          cat > Formula/kei.rb << FORMULA
          class Kei < Formula
            desc "Photo sync engine - compact, efficient, reliable"
            homepage "https://github.com/rhoopr/kei"
            version "$VERSION"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "$BASE/${ASSETS[macos-aarch64]}"
                sha256 "${SHAS[macos-aarch64]}"
              else
                url "$BASE/${ASSETS[macos-x86_64]}"
                sha256 "${SHAS[macos-x86_64]}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "$BASE/${ASSETS[linux-aarch64]}"
                sha256 "${SHAS[linux-aarch64]}"
              else
                url "$BASE/${ASSETS[linux-x86_64]}"
                sha256 "${SHAS[linux-x86_64]}"
              end
            end

            def install
              bin.install "kei"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/kei --version")
              assert_match "kei", shell_output("#{bin}/kei --help")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/kei.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kei.rb
          git commit -m "kei ${GITHUB_REF_NAME#v}"
          git push
