name: Nightly qualification

on:
  schedule:
    - cron: "5 0 * * *"
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-qualification
  cancel-in-progress: false

jobs:
  broad:
    if: github.ref == 'refs/heads/main'
    name: Main push CI evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/nightly_evidence.py main

  fuzz:
    if: github.ref == 'refs/heads/main'
    name: Seeded fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Dwarnings
      FUZZ_MAX_TOTAL_TIME: "120"
      FUZZ_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.94.1"
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: "nightly-2026-05-15"
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo +1.94.1 install --locked cargo-fuzz --version 0.13.1
      - name: Prepare the fuzz corpus directory
        run: mkdir -p fuzz/corpus
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-
      - run: bash scripts/ci/seeded-fuzz.sh
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always()
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

  audit:
    if: github.ref == 'refs/heads/main'
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b7d831ec1a6ef0d81d27cf61932d92140b2271d4 # cargo-audit
      - run: cargo audit --deny warnings

  optimized:
    name: Optimized library tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/nightly_evidence.py optimized
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: steps.evidence.outputs.run != 'false'
        with:
          toolchain: "1.94.1"
      - if: steps.evidence.outputs.run != 'false'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libimage-exiftool-perl
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.evidence.outputs.run != 'false'
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        if: steps.evidence.outputs.run != 'false'
        with:
          version: 2026.8.10
          sha256: 1f5e8795d24073904ef20ba70c1250ad6389d8c5672226d152e0ed24909ba72f
          mise_toml: |
            [tools]
            just = "1.50.0"
      - name: Run optimized library tests
        if: steps.evidence.outputs.run != 'false'
        run: cargo test --locked --release --all-features --lib

  result:
    if: always() && github.ref == 'refs/heads/main'
    needs: [broad, fuzz, audit, optimized]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/gate.py broad fuzz audit optimized

  notify:
    concurrency:
      group: nightly-incident
      cancel-in-progress: false
    if: always() && github.ref == 'refs/heads/main'
    needs: result
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Notify only on failure or recovery transitions
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.result.result }}
        run: python3 scripts/ci/nightly.py report
