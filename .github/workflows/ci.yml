name: Rust CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      qualification: ${{ steps.route.outputs.qualification }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          LIGHT_ENABLED: ${{ vars.CI_LIGHT_PR_ENABLED }}
        run: python3 scripts/ci/policy.py

  checks:
    needs: plan
    if: needs.plan.outputs.qualification == 'false'
    uses: ./.github/workflows/checks.yml

  qualification:
    needs: plan
    if: needs.plan.outputs.qualification == 'true'
    uses: ./.github/workflows/qualification.yml

  ci:
    name: CI
    if: always()
    needs: [plan, checks, qualification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Fail closed on missing or skipped routed work
        env:
          NEEDS: ${{ toJSON(needs) }}
          QUALIFICATION: ${{ needs.plan.outputs.qualification }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          sys.path.insert(0, "scripts/ci")
          from gate import check
          mode = os.environ["QUALIFICATION"]
          if mode not in {"true", "false"}:
              raise SystemExit("missing CI route")
          check(json.loads(os.environ["NEEDS"]), ["plan", "qualification" if mode == "true" else "checks"])
          PYTHON
