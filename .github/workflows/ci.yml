name: Rust CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/checks.yml

  qualification:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/qualification.yml
