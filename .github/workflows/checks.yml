name: Shared quality checks

on:
  workflow_call:
    inputs:
      heavy:
        type: boolean
        default: false
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE_TOOLCHAIN: "1.94.1"
  RUST_NIGHTLY_TOOLCHAIN: "nightly-2026-05-15"
  # Treat any compiler warning as an error to keep the codebase warning-free
  RUSTFLAGS: "-Dwarnings"

jobs:
  # Enforces consistent code style across the project
  # Fails if any code isn't formatted with rustfmt
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  # Fails when a serializer changes in src/ without a corresponding
  # round-trip test. Mirrors `just gate`'s check-roundtrip-gate.sh.
  roundtrip:
    name: Roundtrip gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - run: bash scripts/check-roundtrip-gate.sh

  # Catches common mistakes, unidiomatic code, and potential bugs
  # Acts as an additional layer of static analysis beyond the compiler
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      # Caches compiled dependencies to speed up subsequent runs
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --all-targets --all-features

  # Keeps the `--no-default-features` build honest so FreeBSD and any other
  # platform without a working C++ toolchain for xmp_toolkit (see #256) can
  # still build kei. Runs clippy + tests on the narrower surface; tests
  # make sure we also catch runtime regressions, not just compile breaks.
  test_no_default:
    name: Test (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Install just for executable dispatcher tests
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.10
          sha256: 1f5e8795d24073904ef20ba70c1250ad6389d8c5672226d152e0ed24909ba72f
          mise_toml: |
            [tools]
            just = "1.50.0"
      - run: cargo test --no-default-features

  # Runs the test suite on all major platforms to catch platform-specific bugs
  # fail-fast: false ensures all platforms run even if one fails
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libimage-exiftool-perl
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install just for executable dispatcher tests
        if: runner.os == 'Linux'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.10
          sha256: 1f5e8795d24073904ef20ba70c1250ad6389d8c5672226d152e0ed24909ba72f
          mise_toml: |
            [tools]
            just = "1.50.0"
      - name: Place Windows test temporaries on the runner data volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'kei-test-temp'
          New-Item -ItemType Directory -Force $testTemp | Out-Null
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Complete offline suite
        run: cargo test --locked --all-features
        env:
          # ExifTool is the independent reader for the HEIF item-map writer.
          # Requiring it where it is installed stops a failed install quietly
          # retiring that coverage.
          KEI_REQUIRE_HEIF_ORACLE: ${{ runner.os == 'Linux' && '1' || '' }}
      # Reuse the all-features debug binaries from the offline suite.
      - name: Record the ignored-test inventory without running live tests
        if: inputs.heavy && runner.os == 'Linux'
        run: cargo test --locked --all-features -- --ignored --list > ignored-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.heavy && runner.os == 'Linux'
        with:
          name: qualification-inventory
          path: ignored-tests.txt
          if-no-files-found: error
          retention-days: 14
      - name: Check ignored stress test remains selectable
        if: runner.os == 'Linux'
        run: bash scripts/test-copies-stress.sh --check

  # One full scale run, independent of the regular platform/feature matrices.
  copies-stress:
    name: Copies stress
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: bash scripts/test-copies-stress.sh

  # Ensures documentation builds without warnings
  # Important for maintaining quality docs, especially for published crates
  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check live wiki command documentation
        if: inputs.heavy
        run: |
          git clone --depth=1 https://github.com/rhoopr/kei.wiki.git "$RUNNER_TEMP/kei-wiki"
          scripts/check-wiki-commands.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/kei-wiki"
      - run: cargo doc --no-deps --all-features

  catalogs:
    name: Safety contracts and scenario catalogs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: |
          python3 scripts/fixtures/check_live_selection.py
          bash scripts/test-scenarios/check.sh
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'

  # Detects dependencies declared in Cargo.toml but not actually used
  # Keeps the dependency tree lean and reduces compile times
  # Requires nightly because cargo-udeps uses unstable features
  unused-deps:
    name: Unused Dependencies
    if: inputs.heavy || vars.CI_LIGHT_PR_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: taiki-e/install-action@7170fe35ac006b4d8f0bcdfba8168cf5c431a122 # cargo-udeps
      - run: cargo +"${RUST_NIGHTLY_TOOLCHAIN}" udeps --all-targets

  # Fast unused-dependency check on the stable toolchain. Main pushes run this;
  # the deeper nightly cargo-udeps analysis stays in heavy qualification.
  machete:
    name: Unused dependencies (machete)
    if: inputs.heavy == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - uses: taiki-e/install-action@b7d831ec1a6ef0d81d27cf61932d92140b2271d4 # cargo-machete
        with:
          tool: cargo-machete
      - run: cargo machete

  # Verifies Cargo.lock is committed and in sync with Cargo.toml
  # Ensures reproducible builds and prevents "works on my machine" issues
  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - run: cargo fetch --locked

  # Enforces the dependency policy in deny.toml: advisories, licenses, bans,
  # and sources.
  security:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: taiki-e/install-action@b7d831ec1a6ef0d81d27cf61932d92140b2271d4 # cargo-deny
        with:
          tool: cargo-deny
      # Ignore list + rationale: deny.toml.
      - run: cargo deny check

  # Check the contract catalog and guard against mutable action refs and privileged manual publishes.
  workflow-hardening:
    name: Workflow hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: python3 scripts/check-contracts
      - run: python3 .github/scripts/check_workflow_hardening.py
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: |
          mkdir -p /tmp/codex/kei/pycache
          PYTHONPYCACHEPREFIX=/tmp/codex/kei/pycache python3 -m py_compile .github/scripts/*.py

  # Keep local script and workflow lint authoritative in protected CI.
  script-lint:
    name: Script and workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.10
          sha256: 1f5e8795d24073904ef20ba70c1250ad6389d8c5672226d152e0ed24909ba72f
          mise_toml: |
            [tools]
            actionlint = "1.7.12"
            ruff = "0.16.3"
            shellcheck = "0.11.0"
            shfmt = "3.13.1"
      - name: Check shell and Python helper syntax
        run: bash scripts/ci/lint.sh

  # Catches spelling mistakes in code, comments, and documentation
  # Small thing but helps maintain a professional codebase. Always runs
  # since typos can land in any kind of file.
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: crate-ci/typos@5374cbf686e897b15713110e233094e2874de7ef # master

  # Main and qualification callers require every job selected for that profile.
  ci:
    name: Shared checks result
    if: always()
    needs:
      - fmt
      - roundtrip
      - clippy
      - test_no_default
      - copies-stress
      - test
      - docs
      - catalogs
      - unused-deps
      - machete
      - lockfile
      - security
      - workflow-hardening
      - script-lint
      - typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require all checks selected for main or qualification
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAVY: ${{ inputs.heavy }}
          LIGHT_ENABLED: ${{ vars.CI_LIGHT_PR_ENABLED }}
        run: python3 scripts/ci/policy.py
