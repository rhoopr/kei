name: Temporary 501 Windows path diagnosis
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  matched-paths:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1
      - name: Compare native path calls with identical private files
        shell: pwsh
        run: |
          git rev-parse HEAD
          rustc -vV
          @'
          use std::{fs, io, path::{Path, PathBuf}, os::windows::ffi::OsStrExt};
          #[link(name = "kernel32")]
          unsafe extern "system" {
              fn MoveFileExW(source: *const u16, destination: *const u16, flags: u32) -> i32;
              fn ReplaceFileW(target: *const u16, replacement: *const u16, backup: *const u16,
                              flags: u32, exclude: *const std::ffi::c_void, reserved: *const std::ffi::c_void) -> i32;
          }
          fn wide(path: &Path, extended: bool) -> Vec<u16> {
              let mut value: Vec<u16> = if extended {
                  // All probe paths are absolute drive paths created beneath our own temporary root.
                  r"\\?\".encode_utf16().collect()
              } else { Vec::new() };
              value.extend(path.as_os_str().encode_wide());
              assert!(!value.contains(&0)); value.push(0); value
          }
          fn move_file(source: &Path, destination: &Path, extended: bool) -> io::Result<()> {
              let a = wide(source, extended); let b = wide(destination, extended);
              // SAFETY: both owned NUL-terminated buffers live for the call; no replacement flag is set.
              let result = unsafe { MoveFileExW(a.as_ptr(), b.as_ptr(), 8) };
              if result == 0 { Err(io::Error::last_os_error()) } else { Ok(()) }
          }
          fn replace(target: &Path, source: &Path, backup: &Path, extended: bool) -> io::Result<()> {
              let a = wide(target, extended); let b = wide(source, extended); let c = wide(backup, extended);
              // SAFETY: all owned NUL-terminated buffers live for the call; distinct files are private fixtures.
              let result = unsafe { ReplaceFileW(a.as_ptr(), b.as_ptr(), c.as_ptr(), 1, std::ptr::null(), std::ptr::null()) };
              if result == 0 { Err(io::Error::last_os_error()) } else { Ok(()) }
          }
          fn report(label: &str, a: &Path, b: &Path, result: &io::Result<()>) {
              println!("{label}: source_units={} destination_units={} result={result:?} raw_os_error={:?}",
                  a.as_os_str().encode_wide().count(), b.as_os_str().encode_wide().count(),
                  result.as_ref().err().and_then(io::Error::raw_os_error));
          }
          fn long_file(parent: &Path, marker: char) -> PathBuf {
              let count = 299 - parent.as_os_str().encode_wide().count() - 1;
              assert!((1..=255).contains(&count)); parent.join(marker.to_string().repeat(count))
          }
          fn main() {
              let root = std::env::temp_dir().join(format!("kei501-probe-{}", std::process::id()));
              fs::create_dir(&root).unwrap();
              let a = root.join("short-source"); let b = root.join("short-final");
              fs::write(&a, b"short source").unwrap();
              let short = move_file(&a, &b, false); report("short_plain_move", &a, &b, &short); short.unwrap();
              assert_eq!(fs::read(&b).unwrap(), b"short source");
              let parent = root.join("p".repeat(130)); fs::create_dir(&parent).unwrap();
              let a = long_file(&parent, 's'); let b = long_file(&parent, 'd');
              fs::write(&a, b"long source").unwrap();
              let plain = move_file(&a, &b, false); report("long_plain_move", &a, &b, &plain);
              if plain.is_ok() { fs::rename(&b, &a).unwrap(); }
              assert_eq!(fs::read(&a).unwrap(), b"long source"); assert!(!b.exists());
              let extended = move_file(&a, &b, true); report("long_extended_move", &a, &b, &extended); extended.unwrap();
              assert_eq!(fs::read(&b).unwrap(), b"long source"); assert!(!a.exists());
              fs::write(&a, b"foreign collision source").unwrap();
              let collision = move_file(&a, &b, true); report("long_extended_collision", &a, &b, &collision);
              assert_eq!(collision.unwrap_err().kind(), io::ErrorKind::AlreadyExists);
              assert_eq!(fs::read(&a).unwrap(), b"foreign collision source");
              assert_eq!(fs::read(&b).unwrap(), b"long source");
              let backup = long_file(&parent, 'b');
              let plain = replace(&b, &a, &backup, false); report("long_plain_replace", &a, &b, &plain);
              if plain.is_ok() {
                  assert_eq!(fs::read(&backup).unwrap(), b"long source");
                  fs::rename(&b, &a).unwrap(); fs::rename(&backup, &b).unwrap();
              }
              assert_eq!(fs::read(&a).unwrap(), b"foreign collision source");
              assert_eq!(fs::read(&b).unwrap(), b"long source"); assert!(!backup.exists());
              let extended = replace(&b, &a, &backup, true); report("long_extended_replace", &a, &b, &extended); extended.unwrap();
              assert_eq!(fs::read(&b).unwrap(), b"foreign collision source");
              assert_eq!(fs::read(&backup).unwrap(), b"long source"); assert!(!a.exists());
              fs::remove_dir_all(root).unwrap();
              println!("All matched-control byte preservation and collision assertions passed.");
          }
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/kei501-path-probe.rs"
          rustc --edition 2024 "$env:RUNNER_TEMP/kei501-path-probe.rs" -o "$env:RUNNER_TEMP/kei501-path-probe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/kei501-path-probe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
